inputs:
  RVdata:
    file: Combined/RV_combined.dat
    kind: RV
    models:
      - radial_velocities
      - gp_multidimensional
  BISdata:
    file: Combined/CCF_BIS_combined.dat
    kind: BIS
    models:
      - gp_multidimensional 
  FWHMdata:
    file: Combined/CCF_FWHM_combined.dat
    kind: FWHM
    models:
      - gp_multidimensional      
common:
  planets:
    b:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [13.5, 15.0]        # 🔥 FIXED: Your result shows 14.296d
        K: [0.5, 3.0]          # 🔥 TIGHTENED: Result shows ~1.87 m/s
        e: [0.00, 0.40]
    c:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [32.0, 35.0]        # 🔥 FIXED: Your result shows 33.685d
        K: [0.5, 3.0]          # 🔥 TIGHTENED: Result shows ~1.81 m/s
        e: [0.10, 0.50]
    d:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [2, 5000]
        K: [0.1, 5.0]
        e: [0.00, 0.70]
  activity:
    boundaries:
      Prot: [15.0, 70.0]
      Pdec: [10.0, 1000.0]
      Oamp: [0.01, 1.0]
    priors:
      Prot: ['Gaussian', 40.00, 20.0]
      Oamp: ['Gaussian', 0.35, 0.035]    
  star:
    star_parameters:
      priors:
        mass: ['Gaussian', 0.83, 0.01]
models:
  radial_velocities:
    planets:
      - b
      - c
      - d
  polynomial_trend:
    model: local_polynomial_trend
    order: 1
  gp_multidimensional:
    # model: tinygp_multidimensional_quasiperiodic
    model: spleaf_multidimensional_esp
    common: activity
    hyperparameters_condition: True
    rotation_decay_condition: True
    RVdata:
      boundaries:
        rot_amp: [0.0, 20.0] #at least one must be positive definite
        con_amp: [-20.0, 20.0]
      derivative: True
    BISdata:
      boundaries:
        rot_amp: [-20.0, 20.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    FWHMdata:
      boundaries:
        rot_amp: [-20.0, 20.0]
        con_amp: [-20.0, 20.0]
      derivative: True
parameters:
  Tref: 2452937.54737118
solver:
  pyde:
    ngen: 75000              # 🔥 INCREASED
    npop_mult: 6             # 🔥 INCREASED
    
  emcee:
    npop_mult: 6             # 🔥 INCREASED
    nsteps: 150000           # 🔥 CRITICAL: 6x longer!
    nburn: 50000             # 🔥 LONGER burn-in
    thin: 15                 
    
  nested_sampling:
    nlive: 1500
    
  recenter_bounds: True
